<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Student</h3>
        </div>

        <div class="card-body">

            <form action="/save_student" method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="text"
                           class="form-control"
                           name="student_id"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text"
                           class="form-control"
                           name="name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text"
                           class="form-control"
                           name="roll_number"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text"
                           class="form-control"
                           name="department"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Semester</label>
                    <input type="number"
                           class="form-control"
                           name="semester"
                           min="1"
                           max="8"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Passport Size Photo</label>
                    <input type="file"
                           class="form-control"
                           name="photo"
                           accept=".jpg,.jpeg,.png"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Register Student
                </button>

                <a href="/students" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
