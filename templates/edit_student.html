<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Student</h3>

        </div>

        <div class="card-body">

            <form
                action="/update_student/{{ student.student_id }}"
                method="POST"
                enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">

                        Student ID

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="student_id"
                        value="{{ student.student_id }}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Student Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ student.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Roll Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="roll_number"
                        value="{{ student.roll_number }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Department

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="department"
                        value="{{ student.department }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Semester

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="semester"
                        value="{{ student.semester }}"
                        min="1"
                        max="8"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Current Photo

                    </label>

                    <br>

                    {% if student.image_path %}

                    <img
                        src="/{{ student.image_path }}"
                        width="150"
                        height="150"
                        style="object-fit:cover;border:2px solid #ccc;border-radius:10px;">

                    {% else %}

                    <p>No Photo Available</p>

                    {% endif %}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Upload New Photo (Optional)

                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="photo"
                        accept=".jpg,.jpeg,.png">

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Update Student

                    </button>

                    <a
                        href="/students"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
